<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ورود مدیریت | Soheil Studio Coding</title>
    
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: Tahoma, Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #eef7f3,
                    #dceee7
                );

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 40px 30px;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #174f3f;
            font-size: 26px;
            margin-bottom: 8px;
        }

        .logo p {
            color: #777;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;

            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid #d8e3df;
            border-radius: 10px;

            outline: none;

            font-size: 15px;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #2d7a62;

            box-shadow:
                0 0 0 3px rgba(45, 122, 98, 0.1);
        }

        .login-button {
            width: 100%;

            padding: 14px;

            border: none;
            border-radius: 10px;

            background: #174f3f;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover {
            background: #216b54;
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #174f3f;

            text-decoration: none;

            font-size: 14px;
        }

        .back-link:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">

            <h1>
                Soheil Studio Coding
            </h1>

            <p>
                ورود به پنل مدیریت
            </p>

        </div>


        <form id="admin-login-form">

            <div class="form-group">

                <label for="email">
                    ایمیل مدیر
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    رمز عبور
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="رمز عبور"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                ورود به پنل
            </button>

        </form>


        <a
            href="../index.html"
            class="back-link"
        >
            ← بازگشت به سایت
        </a>

    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

    const SUPABASE_URL = "https://dzqyfwhkxryxdlirffgm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_bAl87XVHGf29B4GCLREfhw_RlPCg7Et";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    const loginForm =
        document.getElementById("admin-login-form");


    if (loginForm) {

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value.trim();

            const password =
                document.getElementById("password").value;


            console.log("Login attempt:", email);


            const { data, error } =
                await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });


            if (error) {

                console.error("Login Error:", error);

                alert(
                    "❌ ورود ناموفق بود:\n" +
                    error.message
                );

                return;
            }


            console.log("Login Success:", data);

            alert("✅ ورود موفق بود!");


            window.location.href =
                "dashboard.html";

        });

    }

</script>
</body>

</html>
